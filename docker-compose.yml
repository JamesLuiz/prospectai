services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      GMAPS_SCRAPER_URL: ${GMAPS_SCRAPER_URL:-http://gmaps-scraper:8080}
    volumes:
      - prospectai-data:/app/data
    depends_on:
      - gmaps-scraper
    command: ["sh", "-c", "mkdir -p /app/data && npm start"]
    restart: unless-stopped

  gmaps-scraper:
    image: gosom/google-maps-scraper
    volumes:
      - gmapsdata:/gmapsdata
    command: ["-web", "-data-folder", "/gmapsdata"]
    restart: unless-stopped

volumes:
  prospectai-data:
  gmapsdata:
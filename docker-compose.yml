services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - prospectai-data:/app/data
    depends_on:
      - gmaps-scraper
    command: ["sh", "-c", "mkdir -p /app/data && npm run db:migrate && npm start"]
    restart: unless-stopped

  gmaps-scraper:
    image: gosom/google-maps-scraper
    ports:
      - "8081:8080"
    volumes:
      - gmapsdata:/gmapsdata
    command: ["-data-folder", "/gmapsdata"]
    restart: unless-stopped

volumes:
  prospectai-data:
  gmapsdata:
